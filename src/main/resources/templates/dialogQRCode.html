<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<div class="modal fade modal-lg" id="meuModal" tabindex="-1" data-keyboard="false">
	<form action="/qrcode" method="POST">
		<div class="modal-dialog">
			<div class="modal-content">
				<div id="mensagem" class="alert alert-danger" th:if="${!#strings.isEmpty(mensagem)}">
					<span th:text="${mensagem}"></span>
				</div>
				<div class="modal-header">
					<h4 class="modal-title">QRCode</h4>
				</div>
				<!-- Modal -->
				<div class="modal-body">
				    <div class="text-center">
				        <img class="img-fluid" id="img">
				    </div>
				    <div class="input-group">
				        <input type="text" id="chaveCopiaCola" class="form-control" disabled="true">
				        <span class="input-group-text">
				            <a onclick="copiarChavePix()">
				                <i class="bi bi-copy"></i>
				            </a>
				        </span>
				    </div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal" aria-label="Fechar"></button>
				</div>
			</div>
		</div>
	</form>
</div>
</html>
