<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{template/layoutPadrao}">

<head>
	<title>Oficina</title>
</head>

<section layout:fragment="conteudo">
	<div class="card">
		<div class="card-body">
			<div class="clearfix">
				<h5 class="card-title aw-titulo-panel">Pesquisar documentos</h5>
				<a class="link-offset-2 link-offset-3-hover link-underline link-underline-opacity-0 
	  							link-underline-opacity-75-hover" th:href="@{/}"> Voltar para listagem </a>
			</div>
		</div>
		<div class="panel-body">
			<form method="GET" class="form-horizontal" action="/documento/pesquisarDocumento">
				<div class="form-group">
					<div class="col-sm-4">
						<div class="input-group mb-3">
							<input type="text" class="form-control" placeholder="Qual documento você está procurando?" autofocus="autofocus"></input>
							<span class="input-group-text">
								<button type="submit" class="btn btn-default">
									<i class="bi bi-search"></i>
								</button>
							</span>
						</div>
					</div>
				</div>
			</form>
			<table class="table table-bordered table-striped">
				<thead>
					<tr>
						<th class="text-center col-md-1">#</th>
						<th class="text-center col-md-2">Tipo de documento</th>
						<th class="text-center col-md-2">Descrição</th>
						<th class="text-center col-md-2">Data de cadastro</th>
						<th class="text-center col-md-2">Ações</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${listaDocumentos.empty}">
						<td colspan="6">Não há documentos</td>
					</tr>
					<tr th:each="documento: ${listaDocumentos}">
						<td class="text-center" ></td>
						<td class="text-center" th:text="${documento.tipo}" ></td>
						<td class="text-center" th:text="${documento.nome}" ></td>
						<td class="text-center" th:text="${documento.dataUpload}"></td>
						<td class="text-center">
							<a class="btn btn-link btn-xs"
							   title="Download"
							   rel="tooltip"
							   target="_blank"
							   data-placement="top"
							   th:href="@{/documento/download/{documentoId}(documentoId=${documento.id})}">
							    <span class="bi bi-download ws-color-gray"></span>
							</a>

							<a class="btn btn-link btn-xs" title="Compartilhar" rel="tooltip" data-placement="top">
								<span class="bi bi-whatsapp ws-color-gray"></span>
							</a>
							<a class="btn btn-link btn-xs" title="Excluir" data-toggle="modal" data-target="#confirmacaoExclusaoModalCliente" rel="tooltip" data-placement="top">
								<span class="bi bi-trash-fill ws-color-gray"></span>
							</a>
						</td>
					</tr>
				</tbody>
			</table>
			<div th:if="${!listaDocumentos.empty}">
				<div th:replace="template/paginacao"></div>
			</div>
		</div>
	</div>
</section>
</html>
