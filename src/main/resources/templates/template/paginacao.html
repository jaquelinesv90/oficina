<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
   xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" lang="en">
   <nav aria-label="Page navigation example">
      <ul class="pagination">
         <!-- Botão "Anterior" -->
         <li class="page-item">
            <a class="page-link" disabled="true" aria-label="Anterior">
            <span aria-hidden="true">&laquo;</span>
            </a>
         </li>
         <!-- Links para as páginas -->
         <span th:if="${totalPages != null and totalPages > 0}">
            <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
               <li class="page-item" th:classappend="${currentPage == i} ? 'active'">
                  <a class="page-link" 
                     th:if="${currentPage != i}" 
                     th:href="@{${url}(page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                     th:text="${i}"></a>
                  <span th:if="${currentPage == i}" 
                     class="page-link active"
                     th:text="${i}"></span>
               </li>
            </th:block>
         </span>
         <!-- Botão "Próximo" -->
         <li class="page-item">
            <a class="page-link" aria-disabled="true" aria-label="Próximo">
            <span aria-hidden="true">&raquo;</span>
            </a>
         </li>
      </ul>
   </nav>
</html>
